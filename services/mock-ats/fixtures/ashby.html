<!doctype html><html><head><meta charset="utf-8"><title>Ashby — Apply (mock)</title></head>
<body>
<h1>Apply to Initech — Ashby (mock)</h1>
<form id="application" method="post" action="/apply/ashby">
  <fieldset>
    <legend>Personal info</legend>
    <label>First name <input name="first_name" type="text" required></label><br>
    <label>Last name  <input name="last_name"  type="text" required></label><br>
    <label>Email      <input name="email"      type="email" required></label><br>
    <label>Phone      <input name="phone"      type="tel"></label><br>
    <label>Resume     <input name="resume"     type="file"></label><br>
  </fieldset>
  <fieldset>
    <legend>Questions</legend>
    <label>Links (GitHub/portfolio) <textarea name="links" rows="3"></textarea></label><br>
    <label>Anything else? <textarea name="notes" rows="5"></textarea></label><br>
  </fieldset>
  <button type="submit" id="submit">Submit Application</button>
</form>
<p>Mock Ashby fixture — no real data leaves this Pi.</p>
</body></html>
