<!doctype html><html><head><meta charset="utf-8"><title>Greenhouse — Apply (mock)</title></head>
<body>
<h1>Apply to Acme Corp — Greenhouse (mock)</h1>
<form id="application" method="post" action="/apply/greenhouse">
  <fieldset>
    <legend>Personal information</legend>
    <label>First name <input name="first_name" type="text" required></label><br>
    <label>Last name  <input name="last_name"  type="text" required></label><br>
    <label>Email      <input name="email"      type="email" required></label><br>
    <label>Phone      <input name="phone"      type="tel"></label><br>
    <label>Location  <input name="location"    type="text"></label><br>
    <label>Resume    <input name="resume"      type="file"></label><br>
    <label>LinkedIn  <input name="linkedin"    type="url"></label><br>
    <label>Website   <input name="website"     type="url"></label><br>
  </fieldset>
  <fieldset>
    <legend>Application questions</legend>
    <label>How did you hear about us? <input name="source" type="text"></label><br>
    <label>Years of experience <input name="years" type="number"></label><br>
    <label>Work authorization
      <select name="work_auth">
        <option value="">--</option>
        <option>I am authorized to work in the US</option>
        <option>I require sponsorship</option>
      </select></label><br>
    <label>Salary expectation <input name="salary" type="text"></label><br>
    <label>Cover letter <textarea name="cover_letter" rows="6"></textarea></label><br>
  </fieldset>
  <fieldset>
    <legend>Voluntary EEOC questions</legend>
    <label>Gender
      <select name="gender"><option value="">--</option><option>Decline to self-identify</option><option>Woman</option><option>Man</option></select></label><br>
    <label>Race
      <select name="race"><option value="">--</option><option>Decline to self-identify</option><option>Asian</option><option>Black or African American</option></select></label><br>
  </fieldset>
  <button type="submit" id="submit">Submit Application</button>
</form>
<p>Mock Greenhouse fixture — no real data leaves this Pi.</p>
</body></html>
