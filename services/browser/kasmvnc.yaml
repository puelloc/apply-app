# KasmVNC server config (review viewing). Non-interactive: skip the "create a user" prompt.
# SSL/auth are handled by NPM in step 9; the internal web server is plain HTTP on 8443.
command_line:
  prompt: false
network:
  websocket_port: 8443
  ssl:
    require_ssl: false
desktop:
  resolution:
    width: 1920
    height: 1080
  allow_resize: false
